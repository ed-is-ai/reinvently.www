<title id="export-title">Generative AI usage in selected countries, Q1 2026</title>
<metadata>Source: Microsoft AI Diffusion Index. Presentation: Reinvently. Article: https://reinvently.co.uk/blog/global-ai-adoption-attitudes/ Article modified: 2026-09-07T00:00:00+01:00. Population estimates are not measures of productivity or enterprise ROI.</metadata>
