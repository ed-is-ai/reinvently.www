        <title id="country-chart-title">Generative AI usage in selected countries, Q1 2026</title>
        <desc id="country-chart-desc">Share of people aged 15 to 64 using generative AI. UAE: 70.1%. Singapore: 63.4%. UK: 42.2%. South Korea: 37.1%. US: 31.3%. Japan: 22.5%. India: 17.6%. China: 16.4%. Bars start at zero on a common 0 to 80% scale. These are selected countries, not the global top eight.</desc>
