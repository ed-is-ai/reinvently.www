<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" role="img" aria-labelledby="export-title">
<title id="export-title">The Global North–South adoption gap widened</title>
<metadata>Source: Microsoft AI Diffusion Index. Presentation: Reinvently. Article: https://reinvently.co.uk/blog/global-ai-adoption-attitudes/ Article modified: 2026-09-07T00:00:00+01:00. Population estimates are not measures of productivity or enterprise ROI.</metadata>
<rect width="100%" height="100%" fill="#111"/>
<text x="16" y="24" fill="#e2e2e2" font-family="sans-serif" font-size="15">The Global North–South adoption gap widened</text>
<svg x="0" y="36" width="720" height="220" viewBox="0 0 720 220">
        <title id="gap-chart-title">The Global North–South adoption gap widened</title>
        <desc id="gap-chart-desc">H2 2025: North 24.7%, South 14.1%, gap 10.6 percentage points. Q1 2026: North 27.5%, South 15.4%, gap 12.1 percentage points. All bars start at zero on the same 0 to 30% scale.</desc>
        <g stroke="#2c2c2a" stroke-width="1">
          <line x1="300" y1="28" x2="300" y2="178"/><line x1="495" y1="28" x2="495" y2="178"/><line x1="690" y1="28" x2="690" y2="178"/>
        </g>
        <line x1="105" y1="28" x2="105" y2="178" stroke="#383835" stroke-width="1.5"/>
        <g font-family="Montserrat,sans-serif" font-size="10" fill="rgb(150,150,150)" letter-spacing="1.5">
          <text x="105" y="14">H2 2025</text><text x="690" y="14" text-anchor="end">GAP 10.6 PP</text>
          <text x="105" y="98">Q1 2026</text><text x="690" y="98" text-anchor="end">GAP 12.1 PP</text>
        </g>
        <g font-family="Montserrat,sans-serif" font-size="11" fill="rgb(150,150,150)" text-anchor="end">
          <text x="97" y="42">Global North</text><text x="97" y="72">Global South</text>
          <text x="97" y="126">Global North</text><text x="97" y="156">Global South</text>
        </g>
        <path d="M105,27 h481.6 q4,0 4,4 v14 q0,4 -4,4 h-481.6 z" fill="#3987e5"><title>H2 2025 Global North — 24.7 percent</title></path>
        <path d="M105,57 h275 q4,0 4,4 v14 q0,4 -4,4 h-275 z" fill="#666"><title>H2 2025 Global South — 14.1 percent</title></path>
        <path d="M105,111 h536.3 q4,0 4,4 v14 q0,4 -4,4 h-536.3 z" fill="#3987e5"><title>Q1 2026 Global North — 27.5 percent</title></path>
        <path d="M105,141 h300.3 q4,0 4,4 v14 q0,4 -4,4 h-300.3 z" fill="#666"><title>Q1 2026 Global South — 15.4 percent</title></path>
        <g font-family="Montserrat,sans-serif" font-size="12" fill="#e2e2e2">
          <text x="599" y="42">24.7%</text><text x="393" y="72">14.1%</text>
          <text x="654" y="126">27.5%</text><text x="418" y="156">15.4%</text>
        </g>
        <g font-family="Montserrat,sans-serif" font-size="10" fill="rgb(150,150,150)" text-anchor="middle">
          <text x="105" y="202">0</text><text x="300" y="202">10</text><text x="495" y="202">20</text><text x="690" y="202">30%</text>
        </g>
      </svg>
<text x="16" y="275" fill="#aaa" font-family="sans-serif" font-size="11">Source: Microsoft AI Diffusion Index. People aged 15–64; not enterprise adoption or ROI.</text>
<a href="https://reinvently.co.uk/blog/global-ai-adoption-attitudes/"><text x="16" y="295" fill="#aaa" font-family="sans-serif" font-size="10">Reinvently | https://reinvently.co.uk/blog/global-ai-adoption-attitudes/</text></a>
</svg>
