# Prose linting for blog posts. Advisory by design: every rule here is a
# judgement call, so nothing is set to `error` and the CI job never blocks a
# merge. A prose check you overrule twice a week and still have to click past
# is a check you have trained yourself to ignore.
#
# Run locally with:
#
#   vale blog/*/index.html
#
StylesPath = .github/styles
MinAlertLevel = suggestion

# Vale reads the prose out of the markup itself and already skips code, script
# and style content, so there is nothing to configure for those here.
#
# Quoted material is a different matter: the house style reproduces statistics
# and adversarial prompts verbatim, and a linter nudging you to reword someone
# else's words is worse than useless. Every rule therefore carries
# `scope: ~blockquote`. BlockIgnores does not apply to HTML, so scoping is the
# mechanism that actually works.
[*.html]
BasedOnStyles = Reinvently

[*.md]
BasedOnStyles = Reinvently
